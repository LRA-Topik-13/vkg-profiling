services:

  mysql:
    profiles: ["healthy"]
    image: mysql:8.0
    security_opt:
      - seccomp:unconfined
    ports:
      - '0.0.0.0:${MYSQL_PORT:-3307}:3306'
    restart: always
    #    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - ./mysql:/docker-entrypoint-initdb.d
      - data-mysql:/var/lib/mysql
    environment:
      MYSQL_DATABASE: '${MYSQL_DATABASE}'
      MYSQL_USER: '${MYSQL_USER}'
      MYSQL_PASSWORD: '${MYSQL_PASSWORD}'
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD}'

  pgsql:
    profiles: ["healthy"]
    image: postgres:13.2
    ports:
      - '0.0.0.0:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - ./pgsql:/docker-entrypoint-initdb.d
      - data-pgsql:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: '${POSTGRES_DB}'
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'

  mssql:
    profiles: ["healthy"]
    platform: linux/amd64
    image: mcr.microsoft.com/azure-sql-edge:latest
    ports:
      - '0.0.0.0:${MSSQL_PORT:-1433}:1433'
    restart: always
    volumes:
      - ./mssql:/docker-entrypoint-initdb.d
      - data-mssql:/var/opt/mssql
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: '${MSSQL_SA_PASSWORD}'
      MSSQL_USER: '${MSSQL_USER}'
      MSSQL_PASSWORD: '${MSSQL_PASSWORD}'
    entrypoint: /docker-entrypoint-initdb.d/entrypoint.sh
    deploy:
      resources:
        limits:
          memory: 2g

  teiid:
    profiles: ["healthy"]
    platform: linux/amd64
    build:
      context: ./teiid
      dockerfile: Dockerfile
    ports:
      - '0.0.0.0:31000:31000'
      - '0.0.0.0:18080:8080'
      - '0.0.0.0:19990:9990'
      - '0.0.0.0:35432:35432'
    depends_on:
      - "mysql"
      - "pgsql"
      - "mssql"
    volumes:
      - teiid-standalone-configuration:/opt/jboss/wildfly/standalone/configuration
      - teiid-domain-configuration:/opt/jboss/wildfly/domain/configuration

  ontop-mysql:
    profiles: ["healthy"]
    image: ontop/ontop-endpoint:4.1.1
    restart: unless-stopped
    environment:
      ONTOP_ONTOLOGY_FILE: /opt/ontop/input/university.ttl
      ONTOP_MAPPING_FILE: /opt/ontop/input/uni1.obda
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/uni1.docker.properties
      ONTOP_CORS_ALLOWED_ORIGINS: '*'
      ONTOP_DEV_MODE: '${ONTOP_DEV_MODE}'
    ports:
      - '0.0.0.0:18081:8080'
    volumes:
      - ./vkg/obda:/opt/ontop/input
      - ./jdbc:/opt/ontop/jdbc
      - ./wait-for-it:/opt/wait-for-it
    depends_on:
      - "mysql"
    entrypoint: [
        "/opt/wait-for-it/wait-for-it.sh",
        "mysql:3306",
        "--timeout=0",
        "--strict",
        "--",
        "/opt/ontop/entrypoint.sh" ]

  ontop-pgsql:
    profiles: ["healthy"]
    image: ontop/ontop-endpoint:4.1.1
    restart: unless-stopped
    environment:
      ONTOP_ONTOLOGY_FILE: /opt/ontop/input/university.ttl
      ONTOP_MAPPING_FILE: /opt/ontop/input/uni2.obda
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/uni2.docker.properties
      ONTOP_CORS_ALLOWED_ORIGINS: '*'
      ONTOP_DEV_MODE: '${ONTOP_DEV_MODE}'
    ports:
      - '0.0.0.0:18082:8080'
    volumes:
      - ./vkg/obda:/opt/ontop/input
      - ./jdbc:/opt/ontop/jdbc
      - ./wait-for-it:/opt/wait-for-it
    depends_on:
      - "pgsql"
    entrypoint: [
        "/opt/wait-for-it/wait-for-it.sh",
        "pgsql:5432",
        "--timeout=0",
        "--strict",
        "--",
        "/opt/ontop/entrypoint.sh" ]

  ontop-mssql:
    profiles: ["healthy"]
    image: ontop/ontop-endpoint:4.1.1
    restart: unless-stopped
    environment:
      ONTOP_ONTOLOGY_FILE: /opt/ontop/input/university.ttl
      ONTOP_MAPPING_FILE: /opt/ontop/input/uni3.obda
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/uni3.docker.properties
      ONTOP_CORS_ALLOWED_ORIGINS: '*'
      ONTOP_DEV_MODE: '${ONTOP_DEV_MODE}'
    ports:
      - '0.0.0.0:18083:8080'
    volumes:
      - ./vkg/obda:/opt/ontop/input
      - ./jdbc:/opt/ontop/jdbc
      - ./wait-for-it:/opt/wait-for-it
    depends_on:
      - "mssql"
    entrypoint: [
        "/opt/wait-for-it/wait-for-it.sh",
        "mssql:1433",
        "--timeout=0",
        "--strict",
        "--",
        "/opt/ontop/entrypoint.sh" ]

  ontop-teiid:
    profiles: ["healthy"]
    image: ontop/ontop-endpoint:4.1.1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null 'http://localhost:8080/sparql?query=SELECT+%281+AS+%3Fx%29+WHERE+%7B%7D'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      ONTOP_ONTOLOGY_FILE: /opt/ontop/input/university.ttl
      ONTOP_MAPPING_FILE: /opt/ontop/input/university.obda
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/university.docker.properties
      ONTOP_CORS_ALLOWED_ORIGINS: '*'
      ONTOP_DEV_MODE: '${ONTOP_DEV_MODE}'
    ports:
      - '0.0.0.0:8088:8080'
    volumes:
      - ./vkg/obda:/opt/ontop/input
      - ./jdbc:/opt/ontop/jdbc
      - ./wait-for-it:/opt/wait-for-it
    depends_on:
      - "teiid"
    entrypoint: [
        "/opt/wait-for-it/wait-for-it.sh",
        "teiid:31000",
        "--timeout=0",
        "--strict",
        "--",
        "/opt/ontop/entrypoint.sh" ]

  # ── Defected datasource stack ────────────────────────────────────────────────
  mysql-defected:
    profiles: ["defected"]
    image: mysql:8.0
    security_opt:
      - seccomp:unconfined
    ports:
      - '0.0.0.0:${MYSQL_DEFECTED_PORT:-3308}:3306'
    restart: always
    volumes:
      - ./mysql-defected:/docker-entrypoint-initdb.d
      - data-mysql-defected:/var/lib/mysql
    environment:
      MYSQL_DATABASE: '${MYSQL_DATABASE}'
      MYSQL_USER: '${MYSQL_USER}'
      MYSQL_PASSWORD: '${MYSQL_PASSWORD}'
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD}'

  pgsql-defected:
    profiles: ["defected"]
    image: postgres:13.2
    ports:
      - '0.0.0.0:${POSTGRES_DEFECTED_PORT:-5434}:5432'   # was missing in original
    volumes:
      - ./pgsql-defected:/docker-entrypoint-initdb.d
      - data-pgsql-defected:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: '${POSTGRES_DB}'
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'

  teiid-defected:
    profiles: ["defected"]
    platform: linux/amd64
    build:
      context: ./teiid
      dockerfile: Dockerfile.defected
    ports:
      - '0.0.0.0:31001:31000'
    depends_on:
      - "mysql-defected"
      - "pgsql-defected"
    volumes:
      - teiid-defected-standalone-configuration:/opt/jboss/wildfly/standalone/configuration
      - teiid-defected-domain-configuration:/opt/jboss/wildfly/domain/configuration

  ontop-teiid-defected:
    profiles: ["defected"]
    image: ontop/ontop-endpoint:4.1.1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null 'http://localhost:8080/sparql?query=SELECT+%281+AS+%3Fx%29+WHERE+%7B%7D'"]
      interval: 10s
      timeout: 5s
