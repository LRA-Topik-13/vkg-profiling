      test: ["CMD-SHELL", "wget -qO /dev/null 'http://localhost:8080/sparql?query=SELECT+%281+AS+%3Fx%29+WHERE+%7B%7D'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      ONTOP_ONTOLOGY_FILE: /opt/ontop/input/university.ttl
      ONTOP_MAPPING_FILE: /opt/ontop/input/university-blanknode.obda
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/university-blanknode.docker.properties
      ONTOP_CORS_ALLOWED_ORIGINS: '*'
      ONTOP_DEV_MODE: '${ONTOP_DEV_MODE}'
    ports:
      - '0.0.0.0:8083:8080'
    volumes:
      - ./vkg/obda:/opt/ontop/input
      - ./jdbc:/opt/ontop/jdbc
      - ./wait-for-it:/opt/wait-for-it
    depends_on:
      - "teiid-blanknode"
    entrypoint: [
        "/opt/wait-for-it/wait-for-it.sh",
        "teiid-blanknode:31000",
        "--timeout=0",
        "--strict",
        "--",
        "/opt/ontop/entrypoint.sh" ]

  mysql-scalable:
    profiles: ["scalable"]
    image: mysql:8.0
    security_opt:
      - seccomp:unconfined
    ports:
      - '0.0.0.0:${MYSQL_SCALABLE_PORT:-3311}:3306'
    restart: always
    volumes:
      - ./mysql-scalable:/docker-entrypoint-initdb.d
      - data-mysql-scalable:/var/lib/mysql
    environment:
      MYSQL_DATABASE: '${MYSQL_DATABASE}'
      MYSQL_USER: '${MYSQL_USER}'
      MYSQL_PASSWORD: '${MYSQL_PASSWORD}'
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD}'

  pgsql-scalable:
    profiles: ["scalable"]
    image: postgres:13.2
    ports:
      - '0.0.0.0:${POSTGRES_SCALABLE_PORT:-5437}:5432'
    volumes:
      - ./pgsql-scalable:/docker-entrypoint-initdb.d
      - data-pgsql-scalable:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: '${POSTGRES_DB}'
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'

  teiid-scalable:
    profiles: ["scalable"]
    platform: linux/amd64
    build:
      context: ./teiid
      dockerfile: Dockerfile.scalable
    ports:
      - '0.0.0.0:31004:31000'
    depends_on:
      - "mysql-scalable"
      - "pgsql-scalable"
    volumes:
      - teiid-scalable-standalone-configuration:/opt/jboss/wildfly/standalone/configuration
      - teiid-scalable-domain-configuration:/opt/jboss/wildfly/domain/configuration

  ontop-teiid-scalable:
    profiles: ["scalable"]
    image: ontop/ontop-endpoint:4.1.1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null 'http://localhost:8080/sparql?query=SELECT+%281+AS+%3Fx%29+WHERE+%7B%7D'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      ONTOP_ONTOLOGY_FILE: /opt/ontop/input/university-scalable.ttl
      ONTOP_MAPPING_FILE: /opt/ontop/input/university-scalable.obda
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/university-scalable.docker.properties
      ONTOP_CORS_ALLOWED_ORIGINS: '*'
      ONTOP_DEV_MODE: '${ONTOP_DEV_MODE}'
    ports:
      - '0.0.0.0:8084:8080'
    volumes:
      - ./vkg/obda:/opt/ontop/input
      - ./jdbc:/opt/ontop/jdbc
      - ./wait-for-it:/opt/wait-for-it
    depends_on:
      - "teiid-scalable"
    entrypoint: [
        "/opt/wait-for-it/wait-for-it.sh",
        "teiid-scalable:31000",
        "--timeout=0",
        "--strict",
        "--",
        "/opt/ontop/entrypoint.sh" ]

  api:
    profiles: ["shared"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ONTOP_ENDPOINT: "${ONTOP_ENDPOINT:-http://ontop-teiid:8080/sparql}"
      METADATA_SOURCE: "${METADATA_SOURCE:-ontology}"
      ONTOLOGY_FILE: "${ONTOLOGY_FILE:-/app/vkg/obda/university.ttl}"
      OBDA_FILE: "${OBDA_FILE:-/app/vkg/obda/university.obda}"
    ports:
      - '0.0.0.0:${API_PORT:-8000}:8000'
    volumes:
      - ./vkg/obda:/app/vkg/obda:ro
    depends_on:
      ontop-teiid:
        condition: service_healthy
        required: false
      ontop-teiid-defected:
        condition: service_healthy
        required: false
      ontop-teiid-accuracy:
        condition: service_healthy
        required: false
      ontop-teiid-blanknode:
        condition: service_healthy
        required: false
      ontop-teiid-scalable:
        condition: service_healthy
        required: false
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
      profiles: ["shared"]
      build:
        context: ./frontend
        dockerfile: Dockerfile
      ports:
        - '0.0.0.0:${FRONTEND_PORT:-5173}:80'
      depends_on:
        api:
          condition: service_started
          required: false

volumes:
  data-mysql: { }
  data-pgsql: { }
  data-mssql: { }
  teiid-standalone-configuration: { }
  teiid-domain-configuration: { }
  data-mysql-defected: { }
  data-pgsql-defected: { }
  teiid-defected-standalone-configuration: { }
  teiid-defected-domain-configuration: { }
  data-mysql-accuracy: { }
  data-pgsql-accuracy: { }
  teiid-accuracy-standalone-configuration: { }
  teiid-accuracy-domain-configuration: { }
  data-mysql-blanknode: { }
  data-pgsql-blanknode: { }
  teiid-blanknode-standalone-configuration: { }
  teiid-blanknode-domain-configuration: { }
  data-mysql-scalable: { }
  data-pgsql-scalable: { }
  teiid-scalable-standalone-configuration: { }
  teiid-scalable-domain-configuration: { }
    
