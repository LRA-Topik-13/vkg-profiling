    restart: always
    volumes:
      - ./mysql-accuracy:/docker-entrypoint-initdb.d
      - data-mysql-accuracy:/var/lib/mysql
    environment:
      MYSQL_DATABASE: '${MYSQL_DATABASE}'
      MYSQL_USER: '${MYSQL_USER}'
      MYSQL_PASSWORD: '${MYSQL_PASSWORD}'
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD}'

  pgsql-accuracy:
    profiles: ["accuracy"]
    image: postgres:13.2
    ports:
      - '0.0.0.0:${POSTGRES_ACCURACY_PORT:-5435}:5432'
    volumes:
      - ./pgsql-accuracy:/docker-entrypoint-initdb.d
      - data-pgsql-accuracy:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: '${POSTGRES_DB}'
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'

  teiid-accuracy:
    profiles: ["accuracy"]
    platform: linux/amd64
    build:
      context: ./teiid
      dockerfile: Dockerfile.accuracy
    ports:
      - '0.0.0.0:31002:31000'
    depends_on:
      - "mysql-accuracy"
      - "pgsql-accuracy"
    volumes:
      - teiid-accuracy-standalone-configuration:/opt/jboss/wildfly/standalone/configuration
      - teiid-accuracy-domain-configuration:/opt/jboss/wildfly/domain/configuration

  ontop-teiid-accuracy:
    profiles: ["accuracy"]
    image: ontop/ontop-endpoint:4.1.1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null 'http://localhost:8080/sparql?query=SELECT+%281+AS+%3Fx%29+WHERE+%7B%7D'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      ONTOP_ONTOLOGY_FILE: /opt/ontop/input/university.ttl
      ONTOP_MAPPING_FILE: /opt/ontop/input/university.obda
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/university-accuracy.docker.properties
      ONTOP_CORS_ALLOWED_ORIGINS: '*'
      ONTOP_DEV_MODE: '${ONTOP_DEV_MODE}'
    ports:
      - '0.0.0.0:8082:8080'
    volumes:
      - ./vkg/obda:/opt/ontop/input
      - ./jdbc:/opt/ontop/jdbc
      - ./wait-for-it:/opt/wait-for-it
    depends_on:
      - "teiid-accuracy"
    entrypoint: [
        "/opt/wait-for-it/wait-for-it.sh",
        "teiid-accuracy:31000",
        "--timeout=0",
        "--strict",
        "--",
        "/opt/ontop/entrypoint.sh" ]

  # ── Blank node datasource stack ──────────────────────────────────────────────
  mysql-blanknode:
    profiles: ["blanknode"]
    image: mysql:8.0
    security_opt:
      - seccomp:unconfined
    ports:
      - '0.0.0.0:${MYSQL_BLANKNODE_PORT:-3310}:3306'
    restart: always
    volumes:
      - ./mysql-blanknode:/docker-entrypoint-initdb.d
      - data-mysql-blanknode:/var/lib/mysql
    environment:
      MYSQL_DATABASE: '${MYSQL_DATABASE}'
      MYSQL_USER: '${MYSQL_USER}'
      MYSQL_PASSWORD: '${MYSQL_PASSWORD}'
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD}'

  pgsql-blanknode:
    profiles: ["blanknode"]
    image: postgres:13.2
    ports:
      - '0.0.0.0:${POSTGRES_BLANKNODE_PORT:-5436}:5432'
    volumes:
      - ./pgsql-blanknode:/docker-entrypoint-initdb.d
      - data-pgsql-blanknode:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: '${POSTGRES_DB}'
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'

  teiid-blanknode:
    profiles: ["blanknode"]
    platform: linux/amd64
    build:
      context: ./teiid
      dockerfile: Dockerfile.blanknode
    ports:
      - '0.0.0.0:31003:31000'
    depends_on:
      - "mysql-blanknode"
      - "pgsql-blanknode"
    volumes:
      - teiid-blanknode-standalone-configuration:/opt/jboss/wildfly/standalone/configuration
      - teiid-blanknode-domain-configuration:/opt/jboss/wildfly/domain/configuration

